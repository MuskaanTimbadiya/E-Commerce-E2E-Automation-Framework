name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select test suite to run'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - e2e
          - smoke
          - ui
          - all

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: |
        SUITE="${{ github.event.inputs.test_suite || 'api' }}"
        echo "Executing test suite: $SUITE"
        case "$SUITE" in
          api)
            npx playwright test tests/api/api.spec.js --project=chromium
            ;;
          e2e|smoke)
            npx playwright test tests/e2e/e2e.spec.js --project=chromium
            ;;
          ui)
            npx playwright test tests/ui/ui.spec.js --project=chromium
            ;;
          all)
            npx playwright test --project=chromium
            ;;
          *)
            npx playwright test tests/api/api.spec.js --project=chromium
            ;;
        esac

    - name: Upload Test Report & Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: executive-audit-report
        path: |
          reports/
          test-results/
        retention-days: 30
